<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body style="font-family: Arial, sans-serif; line-height: 1.5; color: #333">
    <h1>Hello, {{name}}!</h1>
    <p>We received a request to reset your password.</p>
    <p>Click the link below to set a new password. The link is valid for 15 minutes.</p>
    <p>
      <a href="{{link}}" style="display:inline-block;padding:12px 24px;background-color:#4f46e5;color:#ffffff;text-decoration:none;border-radius:6px">Reset password</a>
    </p>
    <p>If you did not request a password reset, please ignore this email.</p>
  </body>
</html>
